<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HospedaFlow - Gestión de Habitaciones</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-content">
            <a href="index.html" class="brand-logo">
                <span>🏨 HospedaFlow</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Panel Principal</a>
                <a href="reservas.html">Reservas</a>
                <a href="habitaciones.html" class="active">Habitaciones</a>
                <a href="ofertas.html">Ofertas</a>
            </nav>
            <div>
                <button onclick="abrirModal('modalNuevaHabitacion')" class="btn btn-primary">+ Nueva Habitación</button>
            </div>
        </div>
    </header>

    <main class="contenedor">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h1 style="font-size: 1.4rem; font-weight: 700;">Inventario de Habitaciones</h1>
                <p style="font-size: 0.75rem; color: var(--color-text-muted);">
                    Consulta el estado de ocupación y valida disponibilidad sin solapamiento (US-2.1)
                </p>
            </div>
        </div>

        <!-- Formulario Comprobar Disponibilidad -->
        <div class="card-kpi" style="margin-bottom: 24px; background: #fffbeb; border-color: #fde68a;">
            <h3 style="font-size: 0.85rem; font-weight: 700; color: #92400e; margin-bottom: 12px;">
                🔍 Validar Disponibilidad Real por Rango de Fechas
            </h3>
            <form id="formDisponibilidad" style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;">
                <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 140px;">
                    <label>Fecha Entrada</label>
                    <input type="date" id="filtroEntrada" required class="form-input">
                </div>
                <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 140px;">
                    <label>Fecha Salida</label>
                    <input type="date" id="filtroSalida" required class="form-input">
                </div>
                <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 140px;">
                    <label>Tipo</label>
                    <select id="filtroTipo" class="form-select">
                        <option value="Todos">Todos los tipos</option>
                        <option value="Individual">Individual</option>
                        <option value="Doble">Doble</option>
                        <option value="Matrimonial">Matrimonial</option>
                        <option value="Familiar">Familiar</option>
                        <option value="Suite Colonial">Suite Colonial</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Comprobar</button>
                <button type="button" onclick="cargarHabitaciones()" class="btn btn-secondary">Limpiar</button>
            </form>
            <div id="resultadoDisponibilidad" style="margin-top: 12px;"></div>
        </div>

        <!-- Grid de Habitaciones -->
        <div id="gridHabitaciones" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">
            <div class="alerta">Cargando habitaciones...</div>
        </div>
    </main>

    <!-- Modal Nueva Habitación -->
    <div id="modalNuevaHabitacion" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 style="font-size: 1.1rem; margin-bottom: 16px;">Registrar Habitación</h2>
            <form id="formCrearHabitacion">
                <div class="form-group">
                    <label>Número de Habitación *</label>
                    <input type="text" id="habNumero" required placeholder="Ej. 101, 203" class="form-input">
                </div>
                <div class="form-group">
                    <label>Tipo de Habitación *</label>
                    <select id="habTipo" class="form-select">
                        <option value="Individual">Individual</option>
                        <option value="Doble">Doble</option>
                        <option value="Matrimonial" selected>Matrimonial</option>
                        <option value="Familiar">Familiar</option>
                        <option value="Suite Colonial">Suite Colonial</option>
                    </select>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Precio Noche ($) *</label>
                        <input type="number" id="habPrecio" required min="1" value="65" class="form-input">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Capacidad *</label>
                        <input type="number" id="habCapacidad" required min="1" max="10" value="2" class="form-input">
                    </div>
                </div>
                <div class="form-group">
                    <label>Estado Inicial</label>
                    <select id="habEstado" class="form-select">
                        <option value="Disponible">Disponible</option>
                        <option value="Ocupada">Ocupada</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="habDescripcion" rows="2" class="form-textarea" placeholder="Detalles de la habitación..."></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                    <button type="button" onclick="cerrarModal('modalNuevaHabitacion')" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Habitación</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/habitaciones.js"></script>
</body>
</html>
