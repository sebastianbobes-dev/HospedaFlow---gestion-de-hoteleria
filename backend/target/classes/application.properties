# ===============================================
# Configuración Spring Boot - HospedaFlow Backend
# ===============================================
server.port=8080
server.servlet.context-path=/

# Ubicación de persistencia plana en JSON (Sección 3.1)
hospedaflow.data.dir=src/main/resources/data

# Habilitar CORS para permitir peticiones desde el cliente web
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
