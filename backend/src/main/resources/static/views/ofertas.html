<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HospedaFlow - Catálogo de Ofertas</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-content">
            <a href="index.html" class="brand-logo">
                <span>🏨 HospedaFlow</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Panel Principal</a>
                <a href="reservas.html">Reservas</a>
                <a href="habitaciones.html">Habitaciones</a>
                <a href="ofertas.html" class="active">Ofertas</a>
            </nav>
            <div>
                <button onclick="abrirModal('modalNuevaOferta')" class="btn btn-primary">+ Nueva Oferta</button>
            </div>
        </div>
    </header>

    <main class="contenedor">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h1 style="font-size: 1.4rem; font-weight: 700;">Promociones Comerciales</h1>
                <p style="font-size: 0.75rem; color: var(--color-text-muted);">
                    Gestión de descuentos y códigos promocionales aplicables a reservaciones (US-2.3)
                </p>
            </div>
        </div>

        <div id="gridOfertas" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">
            <div class="alerta">Cargando promociones...</div>
        </div>
    </main>

    <!-- Modal Nueva Oferta -->
    <div id="modalNuevaOferta" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 style="font-size: 1.1rem; margin-bottom: 16px;">Crear Oferta Comercial</h2>
            <form id="formCrearOferta">
                <div class="form-group">
                    <label>Título de la Oferta *</label>
                    <input type="text" id="oftTitulo" required placeholder="Ej. Escapada Fin de Semana" class="form-input">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Código Cupón *</label>
                        <input type="text" id="oftCodigo" required placeholder="ESCAPADA15" class="form-input" style="text-transform: uppercase;">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Descuento (%) *</label>
                        <input type="number" id="oftDescuento" required min="1" max="100" value="15" class="form-input">
                    </div>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Fecha Inicio *</label>
                        <input type="date" id="oftInicio" required value="2026-01-01" class="form-input">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Fecha Fin *</label>
                        <input type="date" id="oftFin" required value="2026-12-31" class="form-input">
                    </div>
                </div>
                <div class="form-group">
                    <label>Aplica para Habitación</label>
                    <select id="oftTipo" class="form-select">
                        <option value="Todas">Todas las Habitaciones</option>
                        <option value="Individual">Individual</option>
                        <option value="Doble">Doble</option>
                        <option value="Matrimonial">Matrimonial</option>
                        <option value="Familiar">Familiar</option>
                        <option value="Suite Colonial">Suite Colonial</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="oftDescripcion" rows="2" class="form-textarea" placeholder="Condiciones del descuento..."></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                    <button type="button" onclick="cerrarModal('modalNuevaOferta')" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Oferta</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/ofertas.js"></script>
</body>
</html>
