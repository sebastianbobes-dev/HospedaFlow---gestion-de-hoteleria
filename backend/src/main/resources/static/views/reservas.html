<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HospedaFlow - Control de Reservas</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-content">
            <a href="index.html" class="brand-logo">
                <span>🏨 HospedaFlow</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Panel Principal</a>
                <a href="reservas.html" class="active">Reservas</a>
                <a href="habitaciones.html">Habitaciones</a>
                <a href="ofertas.html">Ofertas</a>
            </nav>
            <div>
                <button onclick="abrirModal('modalNuevaReserva')" class="btn btn-primary">+ Nueva Reserva</button>
            </div>
        </div>
    </header>

    <main class="contenedor">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h1 style="font-size: 1.4rem; font-weight: 700;">Gestión de Reservas</h1>
                <p style="font-size: 0.75rem; color: var(--color-text-muted);">
                    Registro, cálculo de tarifas, confirmación y estatus de estancias (US-2.2)
                </p>
            </div>
        </div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Huésped</th>
                        <th>Habitación</th>
                        <th>Fechas</th>
                        <th>Total (Ref. $)</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tbodyReservas">
                    <tr><td colspan="7" style="text-align: center;">Cargando reservaciones...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Registrar Reserva -->
    <div id="modalNuevaReserva" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 style="font-size: 1.1rem; margin-bottom: 16px;">Registrar Nueva Reservación</h2>
            <form id="formCrearReserva">
                <div class="form-group">
                    <label>Nombre del Huésped *</label>
                    <input type="text" id="resNombre" required placeholder="Ej. Carlos Mendoza" class="form-input">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Correo Electrónico *</label>
                        <input type="email" id="resEmail" required placeholder="correo@gmail.com" class="form-input">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Teléfono *</label>
                        <input type="tel" id="resTelefono" required placeholder="+58 414-0000000" class="form-input">
                    </div>
                </div>
                <div class="form-group">
                    <label>Habitación *</label>
                    <select id="resHabitacion" required class="form-select">
                        <option value="">Cargando habitaciones...</option>
                    </select>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Fecha Entrada *</label>
                        <input type="date" id="resEntrada" required class="form-input">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Fecha Salida *</label>
                        <input type="date" id="resSalida" required class="form-input">
                    </div>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Huéspedes</label>
                        <input type="number" id="resHuespedes" min="1" max="8" value="2" class="form-input">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Código Cupón / Oferta</label>
                        <input type="text" id="resOferta" placeholder="Ej. ESCAPADA15" class="form-input" style="text-transform: uppercase;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Notas Especiales</label>
                    <textarea id="resNotas" rows="2" class="form-textarea" placeholder="Peticiones especiales..."></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
                    <button type="button" onclick="cerrarModal('modalNuevaReserva')" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Registrar Reserva</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/reservas.js"></script>
</body>
</html>
